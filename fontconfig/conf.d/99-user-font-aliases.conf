<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- futura-nd.ttf shipped with a broken name table (family "FuturaND-Medium",
       style U+261E). Its name table is now fixed to family "Futura ND"; keep the
       old names working for existing configs and subtitle files. -->
  <match target="pattern">
    <test name="family"><string>FuturaND-Medium</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Futura ND</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>FuturaND</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Futura ND</string></edit>
  </match>
  <alias>
    <family>Futura</family>
    <prefer><family>Futura ND</family></prefer>
  </alias>
</fontconfig>
